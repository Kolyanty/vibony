[tool.poetry]
name = "task-02-seat-reservation"
version = "0.1.0"
description = "Vibony interview task — concurrent seat/inventory reservation service"
authors = ["Vibony"]
readme = "task.md"

# No third-party dependencies: the task is pure stdlib asyncio, so it runs under the
# sandbox's default --network none with no `poetry install`.

[tool.poetry.dependencies]
python = "^3.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
