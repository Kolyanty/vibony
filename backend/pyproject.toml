[tool.poetry]
name = "vibony-backend"
version = "0.1.0"
description = "Vibony interview backend: sessions, AI assistant, sandbox execution and assessment"
authors = ["Vibony"]
packages = [{ include = "vibony_backend" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.136.1"
anyio = "^4.13"
uvicorn = {extras = ["standard"], version = "^0.46.0"}
litellm = "^1.84.0"
pyyaml = "^6.0.3"
httpx = "^0.28.1"
python-dotenv = "^1.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
alembic = "^1.14"
psycopg = {version = "^3.2", extras = ["binary"]}
argon2-cffi = "^23.1"
itsdangerous = "^2.2"
email-validator = ">=2.2"
authlib = "^1.3"
docker = "^7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
pytest-postgresql = ">=6.1"
pytest-httpx = ">=0.30,<0.36"
pytest-timeout = "^2.4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
timeout = 30
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "docker: requires a running Docker daemon and vibony/sandbox-py:3.12 image",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
